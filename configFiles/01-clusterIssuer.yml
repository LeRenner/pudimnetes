apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: j@lerenner.dev
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns01-token
              key: api-token

---

# Three times because I want them in all three namespaces. I know: very silly.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pudim-wildcard
  namespace: pudimnetes
spec:
  secretName: pudim-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - pudim.xyz
    - "*.pudim.xyz"

---

