apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-deployment
  namespace: pudimnetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitwarden
  template:
    metadata:
      labels:
        app: bitwarden
    spec:
      containers:
        - name: bitwarden-container
          image: vaultwarden/server:1.37.3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: bitwarden-data
              mountPath: /data/
          env:
            - name: SIGNUPS_ALLOWED
              value: "false"
      volumes:
        - name: bitwarden-data
          hostPath:
            path: /home/renner/mount/archive/archive/special/k8s/bitwarden/data

---

apiVersion: v1
kind: Service
metadata:
  name: bitwarden-service
  namespace: pudimnetes
spec:
  selector:
    app: bitwarden
  ports:
    - protocol: TCP
      port: 80 
      targetPort: 80 
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitwarden-ingress
  namespace: pudimnetes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    
spec:
  ingressClassName: traefik
  rules:
    - host: bitwarden.pudim.xyz
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: bitwarden-service
                port:
                  number: 80
  tls:
    - hosts:
        - bitwarden.pudim.xyz
      secretName: bitwarden-tls
