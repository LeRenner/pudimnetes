apiVersion: v1
kind: Namespace
metadata:
  name: immich

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres-deployment
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: immich-postgres-container
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-volume
          hostPath:
            path: /home/renner/mount/archive/archive/special/k8s/immich/postgres

---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey-deployment
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-valkey
  template:
    metadata:
      labels:
        app: immich-valkey
    spec:
      containers:
        - name: immich-valkey-container
          image: docker.io/valkey/valkey:9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: immich
spec:
  selector:
    app: immich-valkey
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning-deployment
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: immich-machine-learning-container
          image: ghcr.io/immich-app/immich-machine-learning:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: TZ
              value: America/Sao_Paulo
          volumeMounts:
            - name: ml-cache-volume
              mountPath: /cache
      volumes:
        - name: ml-cache-volume
          hostPath:
            path: /home/renner/local/immich/ml-cache

---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app: immich-machine-learning
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server-deployment
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server-container
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2283
          env:
            - name: TZ
              value: America/Sao_Paulo

            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_VECTOR_EXTENSION
              value: vectorchord

            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: REDIS_PORT
              value: "6379"

            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003

          volumeMounts:
            # Immich-managed library / iCloud backups
            - name: upload-volume
              mountPath: /data

            # Existing photo collection, deliberately read-only
            - name: existing-pictures-volume
              mountPath: /external/Pictures
              readOnly: true

            # Regenerable data on SSD
            - name: thumbnails-volume
              mountPath: /data/thumbs

            - name: encoded-video-volume
              mountPath: /data/encoded-video

            # Small persistent Immich profile data
            - name: profile-volume
              mountPath: /data/profile

      volumes:
        # iCloud photos uploaded through the Immich mobile app
        - name: upload-volume
          hostPath:
            path: /home/renner/mount/archive/archive/iCloudPictures

        # Existing collection: do not let Immich modify it
        - name: existing-pictures-volume
          hostPath:
            path: /home/renner/mount/archive/archive/Pictures

        # Regenerable data
        - name: thumbnails-volume
          hostPath:
            path: /home/renner/local/immich/thumbnails

        - name: encoded-video-volume
          hostPath:
            path: /home/renner/local/immich/encoded-video

        # Persistent but small
        - name: profile-volume
          hostPath:
            path: /home/renner/mount/archive/archive/special/k8s/immich/profile

---
apiVersion: v1
kind: Service
metadata:
  name: immich-service
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 2283
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: immich.pudim.xyz
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: immich-service
                port:
                  number: 80
  tls:
    - hosts:
        - immich.pudim.xyz
      secretName: immich-tls