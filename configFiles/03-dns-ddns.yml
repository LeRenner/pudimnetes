apiVersion: v1
kind: ConfigMap
metadata:
  name: home-dns-config
  namespace: pudimnetes
data:
  Corefile: |
    .:53 {
        bind 10.0.0.10
        errors
        health :8080
        ready :8181

        header {
            response set ra
        }

        # Local hairpin override: IPv4 only
        template IN A home.pudim.xyz {
            answer "{{ .Name }} 60 IN A 10.0.0.10"
        }

        # Suppress Cloudflare's public IPv6 addresses locally
        template IN AAAA home.pudim.xyz {
        }

        cache 60
        forward . 1.1.1.1 1.0.0.1 {
            force_tcp
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dns
  namespace: pudimnetes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-dns
  template:
    metadata:
      labels:
        app: home-dns
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: coredns
          image: coredns/coredns:1.12.4
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: home-dns-config

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: pudimnetes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns
                  key: token
            - name: DOMAINS
              value: proxy.pudim.xyz
            - name: IP6_PROVIDER
              value: none
            - name: UPDATE_CRON
              value: "@every 2m"
            - name: UPDATE_ON_START
              value: "true"
          volumeMounts:
            - name: cloudflare-token
              mountPath: /run/secrets/cloudflare
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cloudflare-token
          secret:
            secretName: cloudflare-ddns
