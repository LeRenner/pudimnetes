apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale-deployment
  namespace: pudimnetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale-container
          image: headscale/headscale:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /etc/headscale
            - name: data-volume
              mountPath: /var/lib/headscale

        - name: stun
          image: coturn/coturn:latest
          args:
            - -n
            - --stun-only
            - --no-cli
            - --log-file=stdout
            - --listening-port=3478
          ports:
            - containerPort: 3478
              protocol: UDP

      volumes:
        - name: config-volume
          hostPath:
            path: /home/renner/mount/archive/archive/special/k8s/headscale/config
        - name: data-volume
          hostPath:
            path: /home/renner/mount/archive/archive/special/k8s/headscale/data

---

# headscale-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: headscale-service
  namespace: pudimnetes
spec:
  selector:
    app: headscale
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: headscale-stun-service
  namespace: pudimnetes
spec:
  selector:
    app: headscale
  externalTrafficPolicy: Local
  ports:
    - name: stun
      protocol: UDP
      port: 3478
      targetPort: 3478
      nodePort: 32096
  type: NodePort

---

# headscale-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale-ingress
  namespace: pudimnetes
  annotations:   
spec:
  ingressClassName: traefik
  rules:
    - host: headscale.pudim.xyz
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: headscale-service
                port:
                  number: 80
  tls:
    - hosts:
        - headscale.pudim.xyz
      secretName: pudim-wildcard-tls
